<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The OpenLine mark: a brass orb cut by an open line, exactly as Logo.tsx
    draws it.

    Two things were wrong before. The comment named the CSS custom properties
    literally, and a double hyphen is illegal inside an XML comment, so the
    file was not well formed and strict parsers refused it outright. And the
    orb was r=10 inside a 32px bakelite square, so at tab size the coin was
    about 10px of brass on black with the slot cutting it into two thin
    crescents: a yellow fleck, not the golden coin the page shows. The page
    logo has no tile at all, and now neither does this.

    The gradient geometry matches the CSS as well. Logo.tsx paints a circle at
    32 percent, 28 percent, whose default farthest corner radius on a 32px box
    is 31.69, so the stops sit in user space rather than on an
    objectBoundingBox radius that would shade the orb along a different curve.
  -->
  <defs>
    <radialGradient id="brass" gradientUnits="userSpaceOnUse" cx="10.24" cy="8.96" r="31.69">
      <stop offset="0" stop-color="#DBAF52"/>
      <stop offset="0.72" stop-color="#8A6E2F"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#brass)"/>
  <rect x="0" y="14.25" width="32" height="3.5" fill="#17130E"/>
</svg>
