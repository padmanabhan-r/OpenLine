<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The OpenLine mark: an ink orb cut by an open line.
    Black on yellow, so it reads as family to CALL-E's own mark and stays
    legible at 16px in a browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#F2D845"/>
  <circle cx="16" cy="16" r="10" fill="#17160F"/>
  <rect x="4" y="14.25" width="24" height="3.5" fill="#F2D845"/>
</svg>
